<style>
    /* Force crisp pixel art rendering across browsers */
    svg, img, canvas {
      shape-rendering: crispEdges;
      image-rendering: -moz-crisp-edges;
      image-rendering: -webkit-crisp-edges;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    /* Subsystem interactive styling */
    .pixel-hotspot {
      cursor: pointer;
      transition: filter 0.2s ease, transform 0.2s ease, opacity 0.2s ease;
    }

    .pixel-hotspot:hover,
    .pixel-hotspot.is-hovered {
      filter: brightness(1.3) drop-shadow(0 0 14px var(--glow-color, rgba(56, 189, 248, 0.95)));
    }

    .pixel-hotspot:hover .hotspot-highlight-rect,
    .pixel-hotspot.is-hovered .hotspot-highlight-rect {
      opacity: 0.8 !important;
      stroke-width: 3.5px !important;
    }

    /* Prominent illuminated state for SVG hotspot when selected */
    .pixel-hotspot.is-selected {
      filter: brightness(1.35) drop-shadow(0 0 18px var(--glow-color, rgba(56, 189, 248, 1))) drop-shadow(0 0 30px var(--glow-color, rgba(56, 189, 248, 0.75)));
    }

    .pixel-hotspot.is-selected .hotspot-highlight-rect {
      opacity: 1 !important;
      stroke-width: 4.5px !important;
      animation: dashPulse 1.6s infinite linear;
    }

    @keyframes dashPulse {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 24; }
    }

    .hotspot-rail { --glow-color: #009645; }
    .hotspot-shm  { --glow-color: #FA9E0D; }
    .hotspot-acv  { --glow-color: #005EC4; }
    .hotspot-door { --glow-color: #D42E12; }

    /* Ultra prominent subsystem button states */
    .subsystem-btn {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      position: relative;
    }

    /* Dim unselected buttons when something is selected */
    .has-selection .subsystem-btn:not(.is-active) {
      opacity: 0.45;
      transform: scale(0.96);
      filter: grayscale(0.25);
    }

    /* Full active or synchronized hovered button states with MRT line colors */
    .subsystem-btn.btn-rail:hover,
    .subsystem-btn.btn-rail.is-hovered,
    .subsystem-btn.btn-rail.is-active {
      transform: scale(1.04) translateY(-2px);
      background: linear-gradient(145deg, #022c15, #001f0e);
      border-color: #009645;
      box-shadow: 0 0 0 2.5px rgba(0, 150, 69, 0.4), 0 0 20px rgba(0, 150, 69, 0.7);
      z-index: 20;
    }

    .subsystem-btn.btn-shm:hover,
    .subsystem-btn.btn-shm.is-hovered,
    .subsystem-btn.btn-shm.is-active {
      transform: scale(1.04) translateY(-2px);
      background: linear-gradient(145deg, #331f00, #221400);
      border-color: #FA9E0D;
      box-shadow: 0 0 0 2.5px rgba(250, 158, 13, 0.45), 0 0 20px rgba(250, 158, 13, 0.7);
      z-index: 20;
    }

    .subsystem-btn.btn-acv:hover,
    .subsystem-btn.btn-acv.is-hovered,
    .subsystem-btn.btn-acv.is-active {
      transform: scale(1.04) translateY(-2px);
      background: linear-gradient(145deg, #032047, #021430);
      border-color: #005EC4;
      box-shadow: 0 0 0 2.5px rgba(0, 94, 196, 0.45), 0 0 20px rgba(0, 94, 196, 0.7);
      z-index: 20;
    }

    .subsystem-btn.btn-door:hover,
    .subsystem-btn.btn-door.is-hovered,
    .subsystem-btn.btn-door.is-active {
      transform: scale(1.04) translateY(-2px);
      background: linear-gradient(145deg, #3d0c07, #260503);
      border-color: #D42E12;
      box-shadow: 0 0 0 2.5px rgba(212, 46, 18, 0.45), 0 0 20px rgba(212, 46, 18, 0.7);
      z-index: 20;
    }

    @keyframes badgePing {
      0% { transform: scale(1); opacity: 1; }
      50% { transform: scale(1.4); opacity: 0.3; }
      100% { transform: scale(1); opacity: 1; }
    }
    .badge-pulse { animation: badgePing 1.8s infinite ease-in-out; }

    /* Floating star animation */
    @keyframes starTwinkle {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 1; }
    }
    .twinkle-fast { animation: starTwinkle 1.8s infinite ease-in-out; }
    .twinkle-slow { animation: starTwinkle 3.2s infinite ease-in-out; }
  </style>

<!-- Ingest Status Notification Toast & Diagnostic Banner -->
<div class="absolute top-14 inset-x-3.5 max-w-sm mx-auto bg-slate-900/95 border-2 border-emerald-500 text-white px-3.5 py-3 rounded-xl shadow-2xl backdrop-blur-md transition-all duration-300 -translate-y-28 opacity-0 pointer-events-none z-50 flex items-start space-x-3 font-mono text-xs" id="toast">

<div class="flex-1 min-w-0">

<span class="px-1.5 py-0.2 rounded text-[9px] font-bold text-white bg-[#009645]" id="toastBadge">EW RAIL</span>
<span class="text-[10px] font-bold text-emerald-300 uppercase tracking-wide" id="toastStatus">READY FOR DIAGNOSTICS</span>
</div>
<p class="text-[11px] text-slate-200 break-words leading-tight" id="toastMsg">File loaded successfully.</p>

<script>
    const subsystems = {
      rail: {
        code: "EW RAIL",
        badgeBg: "#009645",
        title: "Track Rail Diagnostic",
        subtext: "Corrugation wear, profile geometry & railhead scans",
        color: "#009645",
        elementId: "part-rail",
        btnId: "btn-rail"
      },
      shm: {
        code: "CC SHM",
        badgeBg: "#FA9E0D",
        badgeText: "#020617",
        title: "SHM Bogie & Chassis Diagnostic",
        subtext: "Car body dynamics, wheelset harmonics & bearings",
        color: "#FA9E0D",
        elementId: "part-shm",
        btnId: "btn-shm"
      },
      acv: {
        code: "DT ACV",
        badgeBg: "#005EC4",
        title: "ACV Ventilation Diagnostic",
        subtext: "Saloon HVAC airflow, fan inverter & refrigerant cycle",
        color: "#005EC4",
        elementId: "part-acv",
        btnId: "btn-acv"
      },
      door: {
        code: "NS DOOR",
        badgeBg: "#D42E12",
        title: "Door Bay Diagnostic",
        subtext: "Bi-parting DC actuator current & cycle timings",
        color: "#D42E12",
        elementId: "part-door",
        btnId: "btn-door"
      }
    };

    let currentSelected = null;
    let isFileDialogOpen = false;

    // Synchronized hover highlights
    function setSubsystemHover(key, isHovered) {
      const data = subsystems[key];
      if (!data) return;
      const el = document.getElementById(data.elementId);
      const btn = document.getElementById(data.btnId);

      if (isHovered) {
        if (el) el.classList.add('is-hovered');
        if (btn) btn.classList.add('is-hovered');
      } else {
        if (el) el.classList.remove('is-hovered');
        if (btn) btn.classList.remove('is-hovered');
      }
    }

    // Set up bidirectional mouse/touch hover listeners on elements and buttons
    function initHoverListeners() {
      Object.keys(subsystems).forEach(key => {
        const item = subsystems[key];
        const el = document.getElementById(item.elementId);
        const btn = document.getElementById(item.btnId);

        if (el) {
          el.addEventListener('mouseenter', () => setSubsystemHover(key, true));
          el.addEventListener('mouseleave', () => setSubsystemHover(key, false));
        }

        if (btn) {
          btn.addEventListener('mouseenter', () => setSubsystemHover(key, true));
          btn.addEventListener('mouseleave', () => setSubsystemHover(key, false));
        }
      });
    }

    function clearAllSelectionVisuals() {
      currentSelected = null;
      const container = document.getElementById('subsystemButtonsContainer');
      if (container) container.classList.remove('has-selection');

      Object.keys(subsystems).forEach(k => {
        const item = subsystems[k];
        const el = document.getElementById(item.elementId);
        const btn = document.getElementById(item.btnId);
        const badge = btn ? btn.querySelector('.active-badge') : null;

        if (el) {
          el.classList.remove('is-selected');
          el.classList.remove('is-hovered');
        }
        if (btn) {
          btn.classList.remove('is-active');
          btn.classList.remove('is-hovered');
        }
        if (badge) badge.classList.add('hidden');
      });
    }

    function selectSubsystemVisuals(key) {
      const data = subsystems[key];
      if (!data) return;

      const container = document.getElementById('subsystemButtonsContainer');
      container.classList.add('has-selection');

      // Update all SVG parts and buttons
      Object.keys(subsystems).forEach(k => {
        const item = subsystems[k];
        const el = document.getElementById(item.elementId);
        const btn = document.getElementById(item.btnId);
        const badge = btn ? btn.querySelector('.active-badge') : null;

        if (k === key) {
          if (el) el.classList.add('is-selected');
          if (btn) btn.classList.add('is-active');
          if (badge) badge.classList.remove('hidden');
        } else {
          if (el) el.classList.remove('is-selected');
          if (btn) btn.classList.remove('is-active');
          if (badge) badge.classList.add('hidden');
        }
      });
    }

    function triggerSubsystem(key) {
      currentSelected = key;
      selectSubsystemVisuals(key);

      const fileInput = document.getElementById('subsystemFileInput');
      fileInput.value = '';
      isFileDialogOpen = true;
      fileInput.click();
    }

    // Direct drag & drop handling onto stage or window
    window.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'copy';
    });

    window.addEventListener('drop', (e) => {
      e.preventDefault();
      const files = e.dataTransfer.files;
      if (files && files.length > 0) {
        const targetSub = currentSelected || 'rail';
        selectSubsystemVisuals(targetSub);
        const fileName = files[0].name;
        showTelemetryToast(targetSub, fileName);
      }
    });

    const fileInputEl = document.getElementById('subsystemFileInput');

    fileInputEl.addEventListener('cancel', () => {
      isFileDialogOpen = false;
      clearAllSelectionVisuals();
    });

    window.addEventListener('focus', () => {
      if (isFileDialogOpen) {
        setTimeout(() => {
          if (isFileDialogOpen) {
            if (!fileInputEl.files || fileInputEl.files.length === 0) {
              clearAllSelectionVisuals();
            }
            isFileDialogOpen = false;
          }
        }, 300);
      }
    });

    function handleFileSelected(event) {
      isFileDialogOpen = false;
      const files = event.target.files;
      if (!files || files.length === 0) {
        clearAllSelectionVisuals();
        return;
      }
      const subKey = currentSelected || 'rail';
      const fileName = files.length === 1 ? files[0].name : `${files[0].name} (+${files.length - 1} more)`;
      showTelemetryToast(subKey, fileName);
    }

    function showTelemetryToast(subKey, fileName) {
      const data = subsystems[subKey] || subsystems['rail'];
      const toast = document.getElementById('toast');
      const toastBadge = document.getElementById('toastBadge');
      const toastMsg = document.getElementById('toastMsg');
      const toastDotPing = document.getElementById('toastDotPing');

      toastBadge.textContent = data.code;
      toastBadge.style.backgroundColor = data.badgeBg;
      toastBadge.style.color = data.badgeText || '#FFFFFF';
      toast.style.borderColor = data.color;
      toastDotPing.style.backgroundColor = data.color;

      toastMsg.innerHTML = `<span class="font-semibold text-white">File imported:</span> <span class="text-amber-200 underline">${fileName}</span> &mdash; Telemetry synced for ${data.title}.`;

      toast.classList.remove('-translate-y-28', 'opacity-0', 'pointer-events-none');
      toast.classList.add('translate-y-0', 'opacity-100');

      if (window.toastTimer) clearTimeout(window.toastTimer);
      window.toastTimer = setTimeout(() => {
        toast.classList.remove('translate-y-0', 'opacity-100');
        toast.classList.add('-translate-y-28', 'opacity-0', 'pointer-events-none');
      }, 4800);
    }

    initHoverListeners();
</script>
